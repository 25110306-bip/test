<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First GitHub Web</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #24292f;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        button {
            border: none;
            background: #24292f;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #444;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            color: #2da44e;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🚀 Hello GitHub!</h1>

        <p>
            Đây là website đầu tiên của tôi được deploy
            bằng GitHub Pages.
        </p>

        <button onclick="showMessage()">
            Bấm thử
        </button>

        <div id="message"></div>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "🎉 Website hoạt động rồi!";
        }
    </script>

</body>
</html>
